<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVRAISONS</title>
<meta name="theme-color" content="#0f172a">
<!--
=====================================================================
 APPLICATION DE GESTION DE LIVRAISONS — version générique (licence)
=====================================================================
 MISE EN PLACE POUR UN NOUVEAU CLIENT
 1. Créer un projet Firebase pour le client (console.firebase.google.com).
 2. Activer : Firestore Database + Authentication > Anonyme.
 3. Règles Firestore du client :
      rules_version = '2';
      service cloud.firestore { match /databases/{db}/documents {
        match /{doc=**} { allow read, write: if request.auth != null; } } }
 4. Copier la configuration Web du projet dans CONFIG.firebase ci-dessous.
 5. Dans la base centrale « MES LICENCES KOUTHON », collection "licences",
    créer un document dont l'ID = la clé du client, avec les champs :
      actif (booléen) = true, client (texte), app (texte) = "livraison",
      expire (date, facultatif)
    Règles de la base centrale :
      match /licences/{cle} { allow get: if true; allow list, write: if false; }
 6. Mettre la clé dans CONFIG.licenceCle et la config centrale dans CONFIG.licences.
 7. Héberger ce fichier en HTTPS (Firebase Hosting, par ex.) : le GPS
    du téléphone ne fonctionne que sur une adresse https://.
 8. RECHERCHE DE LIEUX GOOGLE (conseillée) : sur console.cloud.google.com,
    avec le même compte Google, activer « Maps JavaScript API » et
    « Places API (New) », créer une clé API, puis la RESTREINDRE :
    - Restrictions d'application : Sites web → l'adresse de l'application
      (ex. https://express-livraison.web.app/*)
    - Restrictions d'API : seulement les deux API ci-dessus.
    Mettre la clé dans CONFIG.googleCle. Sans clé, la recherche gratuite
    (OpenStreetMap) est utilisée.
 Sans configuration Firebase, l'application tourne en MODE ESSAI
 (données gardées sur le téléphone uniquement).
=====================================================================
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#0f172a;--mut:#5d6577;--line:#e1e4ec;--j:#f7841f;--r:#e0412b;--b:#1fa3e0;--v:#1f9d55;--nuit:#0f172a;--nuit2:#1e293b}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#162033;--ink:#f1f4f9;--mut:#9aa4b8;--line:#26324a}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:54px;background:var(--nuit);color:#fff}
header b{color:var(--j);font-weight:800;font-size:18px}
.ver-badge{margin-right:auto;font:700 12px Archivo,system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:99px;white-space:nowrap}.ver-badge:empty{display:none}
#mode{font-size:12px;background:var(--r);padding:2px 8px;border-radius:99px}#mode:empty{display:none}
.pad{padding:16px;max-width:720px;margin:0 auto}
h1{font-size:38px;line-height:1.05;margin:0 0 8px}h2{font-size:24px;margin:8px 0}h3{font-size:18px;margin:8px 0 4px}
.hero{background:var(--j);color:#151515;padding:44px 16px 34px}.hero>*{max-width:720px;margin-inline:auto}
.hero p{font-size:18px;margin:0}
/* écran d'ouverture plein écran */
#splash{position:fixed;inset:0;z-index:5000;background:var(--nuit);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#splash img{width:min(86vw,72vh);height:auto;border-radius:22%;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:entre .8s ease-out}
#splash p{color:#cbd5e1;margin:0;font-size:15px}#splash.fin{opacity:0;pointer-events:none}
@keyframes entre{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
/* page d'accueil */
.accueil{background:radial-gradient(circle at 50% 18%,var(--nuit2),var(--nuit) 70%);color:#fff;min-height:calc(100vh - 54px);padding:24px 16px 30px;text-align:center}
.accueil>*{max-width:560px;margin-inline:auto}
.accueil .logo{display:block;width:min(70vw,34vh);height:auto;border-radius:22%;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.accueil h1{margin:14px auto 4px;font-size:clamp(28px,8vw,40px)}.accueil>p{color:#cbd5e1;margin:0 auto 22px;font-size:17px}
.opts{display:grid;gap:12px;text-align:left}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border:0;border-radius:18px;font:inherit;color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .15s}
.opt:active{transform:scale(.98)}.opt b{display:block;font-size:19px}.opt small{display:block;font-size:14px;opacity:.9}
.opt .ico{flex:none;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.opt .ico svg{width:30px;height:30px}
.o1{background:linear-gradient(135deg,#f7841f,#e8590c)}
.o2{background:linear-gradient(135deg,#38bdf8,#0284c7)}
.o3{background:linear-gradient(135deg,#334155,#1e293b);border:2px solid #f7841f!important}
.ver{color:#7c8aa5!important;font-size:13px!important;margin-top:22px!important}
/* bandeau avec l'icône en haut des pages ouvertes par lien */
.bandeau{display:flex;align-items:center;gap:14px;padding:16px;background:radial-gradient(circle at 20% 50%,var(--nuit2),var(--nuit));color:#fff}
.bandeau img{width:72px;height:72px;border-radius:18px;flex:none}.bandeau b{display:block;font-size:20px}.bandeau span{color:#cbd5e1;font-size:14px}
.bandeau.o1c{border-bottom:5px solid #f7841f}.bandeau.o2c{border-bottom:5px solid #38bdf8}.bandeau.o3c{border-bottom:5px solid #64748b}
.grid{display:grid;gap:12px}
.big{display:block;text-align:left;width:100%;padding:18px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.big b{display:block;font-size:19px}.big small{color:var(--mut);font-size:14px}
.big.noir{border-color:#151515;background:#151515;color:#fff}.big.noir small{color:#ccc}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 15px Archivo,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.s{min-height:40px;padding:0 12px;font-size:14px}
.btn.jaune{background:var(--j);border-color:var(--j);color:#151515}
.btn.vert{background:var(--v);border-color:var(--v);color:#fff}
.btn.rouge{border-color:var(--r);color:var(--r)}
.btn.plein{width:100%;margin-top:10px}
.lien{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;min-height:40px}
.form label{display:block;margin:10px 0;font-weight:600;font-size:14px}
input,select,textarea{display:block;width:100%;margin-top:4px;min-height:46px;padding:10px 12px;font:16px Archivo,system-ui,sans-serif;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--j);outline-offset:1px}
fieldset{border:1.5px solid var(--line);border-radius:14px;padding:6px 12px 10px;margin:14px 0}
legend{font-weight:800;padding:0 6px}
.map{height:260px;border-radius:12px;margin:10px 0;z-index:0;background:var(--line)}
.haute{height:340px}.pleine{border-radius:0;margin:0;height:300px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card p{margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.sb{justify-content:space-between}
.note{color:var(--mut);font-size:14px}.vide{color:var(--mut);text-align:center;padding:30px 0}
.alerte{background:#fff4cc;color:#5a4500;padding:10px 12px;border-radius:10px;margin:8px 0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--j);color:#151515}
.pill.acceptee{background:var(--b);color:#fff}.pill.recuperee{background:#7b4fe0;color:#fff}.pill.livree{background:var(--v);color:#fff}.pill.annulee{background:#888;color:#fff}
.res{display:grid;gap:6px;margin:4px 0 8px}
.res button{display:block;text-align:left;width:100%;min-height:52px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:15px Archivo,system-ui,sans-serif;cursor:pointer}
.res button:active{border-color:var(--j)}.lienTxt{font-weight:600;overflow-wrap:anywhere;background:var(--bg);padding:8px;border-radius:8px}.qr{margin-top:8px}.qr img,.qr canvas{background:#fff;padding:10px;border-radius:8px}
.gg{text-align:right;font-size:12px!important}.res button.connu{background:#fff4cc;color:#3a2c00;border-color:#f0d27a}.res button.connu small{color:#6b5a1f}.res small{display:block;color:var(--mut);font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--b);color:#fff;white-space:nowrap}
.badge.gris{background:#888}.badge.vert{background:var(--v)}
.card.loin{opacity:.7}.cand{border-top:1px solid var(--line);padding-top:6px}
.avatar{object-fit:cover;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;flex:none;vertical-align:middle;background:var(--line)}
.avatar.mini{width:28px;height:28px;margin-right:6px}.avatar.moyen{width:48px;height:48px}.avatar.grand{width:72px;height:72px}
.avatar.vide{display:inline-grid;place-items:center;font-size:20px;cursor:default}
.photoBox input[type=file]{display:none}.photoBox .btn{display:inline-flex!important;width:auto;margin:0}
.photoBox{display:grid;justify-items:center;gap:8px;text-align:center;margin:6px 0 12px}
#phPrev{width:140px;height:140px;border-radius:50%;overflow:hidden;background:var(--line);display:grid;place-items:center;color:var(--mut);font-size:14px}
#phPrev img{width:100%;height:100%;object-fit:cover}
.paye{background:#eefaf2;color:#0f5132;border-left:4px solid var(--v);padding:8px 10px;border-radius:8px;margin:6px 0}
.fil{display:grid;gap:6px;margin:8px 0}.bulle{max-width:88%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.bulle small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}.bulle.moi{justify-self:end;border-radius:14px 14px 4px 14px;background:#fff1e3;color:#3a2000;border-color:#f6c99b}
.parti{color:var(--b);font-weight:700;margin:6px 0}
#etat{position:fixed;left:0;right:0;bottom:0;z-index:1500;display:grid;gap:1px}
.et{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:15px;font-weight:600;color:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.et span{flex:1}.et button{flex:none;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;min-width:40px;min-height:40px;font:inherit;cursor:pointer}
.et.net,.et.bug{background:#c0392b}.et.gps{background:#d35400}.et.wait{background:#0369a1}.et.info{background:#1f9d55}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:#fde7d2;color:#8a3b00}
.tag.fragile{background:#fde2e2;color:#a61b1b}.consigne{background:#eef6fd;color:#0b3d62;border-left:4px solid var(--b);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:15px}
.choix{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.choix label{margin:0!important;display:inline-flex!important;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-weight:600;cursor:pointer}
.choix input{width:auto;min-height:0;margin:0;display:inline;accent-color:var(--j)}.choix label:has(input:checked){border-color:var(--j);background:#fff1e3;color:#8a3b00}
.alarme.bon{background:var(--v)}
.gain{color:var(--v);font-weight:600}
.btn.noir{background:#151515;border-color:#151515;color:var(--j)}
details{margin:12px 0}summary{cursor:pointer;font-weight:700;padding:10px 0;min-height:44px}
.etoiles{color:#e8a400;letter-spacing:1px;white-space:nowrap}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}.stars input{position:absolute;opacity:0;width:0}
.stars label{font-size:40px;line-height:1;color:#ccc;cursor:pointer;margin:0;padding:2px}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:#e8a400}.stars input:focus-visible+label{outline:3px solid var(--j)}
.card.plainte{border-left:5px solid var(--r)}
.chrono{margin:6px 0;padding:6px 10px;border-radius:8px;background:#fff4cc;color:#5a4500;font-size:14px}
.chrono.urgent{background:#ffd9a8;color:#7a3a00}.chrono.retard{background:var(--r);color:#fff;font-weight:700}
.alarme{background:var(--r);color:#fff;border-radius:14px;padding:16px;margin-bottom:6px}.alarme h2{margin-top:0}
.code{font-size:13px;color:var(--mut);font-weight:600}
.dist{font-weight:800;color:var(--b);white-space:nowrap}
.gros{font-size:20px;font-weight:800;margin:6px 0}
.total{display:flex;justify-content:space-between;font-size:18px;margin:14px 0 0;padding:12px;background:var(--card);border-radius:12px;border:1px solid var(--line)}
.etapes{display:flex;list-style:none;padding:0;margin:12px 0;gap:4px}
.etapes li{flex:1;text-align:center;font-size:12px;color:var(--mut);border-top:5px solid var(--line);padding-top:6px}
.etapes li.fait{border-color:var(--j);color:var(--ink);font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:54px;z-index:900;padding:10px 12px;scrollbar-width:none}
.tabs button{flex:none;padding:9px 15px;border:2px solid var(--tc);border-radius:99px;background:var(--tcl);color:var(--tc);font:700 15px Archivo,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--tc);color:#fff;box-shadow:0 4px 12px var(--tcl)}
/* une couleur par onglet */
.t-dir,.t-dem{--tc:#e8590c;--tcl:rgba(232,89,12,.12)}
.t-liv,.t-mes{--tc:#0284c7;--tcl:rgba(2,132,199,.12)}
.t-lvr,.t-bil{--tc:#16a34a;--tcl:rgba(22,163,74,.12)}
.t-pla{--tc:#7c3aed;--tcl:rgba(124,58,237,.12)}
.t-cai{--tc:#b7791f;--tcl:rgba(183,121,31,.14)}
.t-rap{--tc:#4338ca;--tcl:rgba(67,56,202,.12)}
.t-reg{--tc:#475569;--tcl:rgba(71,85,105,.12)}
/* la page prend la couleur de son onglet */
.vue{border-top:6px solid var(--tc);background:linear-gradient(var(--tcl),transparent 220px)}
.vue h3{color:var(--tc)}
.vue .card{border-left:6px solid var(--tc)}
.vue .card.plainte{border-left-color:var(--r)}
.vue .kpi{border-top:5px solid var(--tc)}
.vue .kpi.fort{background:var(--tc);border-color:var(--tc)}.vue .kpi.fort b{color:#fff}
/* sections du formulaire client */
.sec{border:0;border-left:6px solid var(--sc);background:var(--sct);border-radius:14px;padding:14px 14px 10px;margin:16px 0}
.sec legend{background:var(--sc);color:#fff;border-radius:99px;padding:5px 14px;font-weight:800;font-size:15px;margin-bottom:4px}
.s-vous{--sc:#475569;--sct:rgba(71,85,105,.08)}
.s-prise{--sc:#e0412b;--sct:rgba(224,65,43,.08)}
.s-dest{--sc:#16a34a;--sct:rgba(22,163,74,.08)}
.s-colis{--sc:#0284c7;--sct:rgba(2,132,199,.08)}
.s-reco{--sc:#7c3aed;--sct:rgba(124,58,237,.08)}
.s-delai{--sc:#e8590c;--sct:rgba(232,89,12,.08)}
.s-pay{--sc:#b7791f;--sct:rgba(183,121,31,.10)}
.lvNtfy{border-bottom:1px solid var(--line);padding:6px 0}.lvNtfy label{flex-wrap:nowrap;gap:8px}.lvNtfy input{display:inline-block!important;accent-color:var(--v)}
.soustitre{font-weight:700;margin:12px 0 4px}
/* cartes du suivi */
.c-det{border-left:6px solid #0284c7}.c-pay{border-left:6px solid #b7791f}.c-pay h3{color:#b7791f}
.c-msg{border-left:6px solid #7c3aed}.c-msg h3{color:#7c3aed}.c-avis{border-left:6px solid #16a34a}.c-avis h3{color:#16a34a}
.lvbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card)}.lvbar small{display:block;color:var(--mut)}
.switch{position:relative;width:58px;height:32px;flex:none}.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#999;border-radius:99px;transition:.2s}
.switch span::after{content:'';position:absolute;width:26px;height:26px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--v)}.switch input:checked+span::after{transform:translateX(26px)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{color:var(--mut);display:block;font-size:13px}.kpi b{font-size:22px;white-space:nowrap}
.kpi.fort{background:#151515;color:#fff;border-color:#151515}.kpi.fort small{color:#ccc}.kpi.fort b{color:var(--j)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.n{text-align:right;white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:flex;align-items:flex-end;justify-content:center}#modal[hidden]{display:none}
.boite{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
#toast{pointer-events:none;position:fixed;left:50%;top:66px;bottom:auto;transform:translate(-50%,-140px);background:#151515;color:#fff;padding:12px 18px;border-radius:12px;z-index:3000;transition:.25s;opacity:0;max-width:90vw}
#toast.on{transform:translate(-50%,0);opacity:1}
.leaflet-tooltip{font:600 12px Archivo,system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function estimer(id, pos, P){ if(!pos || !P || P.lat == null) return null;
  const ch = etapesLv(id), direct = km(pos, P);
  if(!ch.length) return {min:minutes(direct), occupe:false};

  if(T && T.lat != null){ const det = km(pos, P) + km(P, T) - km(pos, T); if(det <= DETOUR) return {min:minutes(direct), occupe:true, trajet:true, detour:det}; }
  let t = 0, cur = pos; for(const e of ch){ if(e && e.lat != null){ t += minutes(km(cur, e)) + 3; cur = e; } else t += 15; }
  return {min:t + minutes(km(cur, P)), occupe:true, trajet:false}; }

// sonnerie « comme un appel » : deux tons qui se répètent jusqu'à « J'ai compris » (1 minute maximum)
function bip(){ try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); const t0 = audio.currentTime;
  [0, .5].forEach(d => [880, 1100].forEach((f, k) => { const o = audio.createOscillator(), g = audio.createGain(); o.type = 'square'; o.frequency.value = f;
    g.gain.value = .3; o.connect(g).connect(audio.destination); o.start(t0 + d + k * .2); o.stop(t0 + d + k * .2 + .18); })); } catch {} }
let sonnerie = null, titreOrig = document.title, clignote = null;
function sonner(long, titre){ arreterSonnerie(); const fin = Date.now() + (long ? 60000 : 2500);
  const tour = () => { if(Date.now() > fin) return arreterSonnerie(); bip(); try { navigator.vibrate && navigator.vibrate([700, 300, 700]); } catch {} };
  tour(); sonnerie = setInterval(tour, 2200);
  if(long){ let x = 0; clignote = setInterval(() => document.title = (x++ % 2) ? titreOrig : '🔔 ' + titre, 900); } }
function arreterSonnerie(){ clearInterval(sonnerie); clearInterval(clignote); sonnerie = clignote = null; document.title = titreOrig; try { navigator.vibrate && navigator.vibrate(0); } catch {} }

const rappelMs = () => (+S.p.rappelMin || 10) * 60000;
function rappels(){ if(!DB) return; const N = rappelMs(), now = Date.now(), moi = ls.get('cmd', null);
  S.livraisons.forEach(c => {
    if(!['attente','acceptee'].includes(c.statut)) return;
    if(['client','dest'].includes(S.role) && c.id !== (S.role === 'dest' ? S.destId : moi)) return;   // un client ne s'occupe que de sa commande
    if(!['client','dest','livreur','patron'].includes(S.role)) return;
    const base = c.statut === 'acceptee' ? (c.accepteeLe || c.creeLe) : c.creeLe;
    if(now - Math.max(c.rappelLe || 0, base) < N) return;
    const ancien = c.rappels || 0, n = ancien + 1, min = Math.round((now - base) / 60000);
    c.rappelLe = now; c.rappels = n;
    DB.reserver(c.id, ancien, {rappelLe:now, rappels:n}).then(() => {
      if(c.statut === 'acceptee'){
        ntfy(canalLv(c.livreurId), '⏰ Rappel : le client vous attend', `${c.code} : ${resumeCmd(c)} — accepté il y a ${min} min, colis pas encore récupéré`, 5, '#livreur');
        if(n >= 2) ntfy(canalPatron(), `⏰ ${c.livreurNom} ne s'est pas encore présenté`, `${c.code} accepté il y a ${min} min, colis toujours pas récupéré`, 5, '#patron');

function localDB(){ const K = 'livr_essai'; let st = ls.get(K, {}); const ecoute = [];

    async set(c, id, d){ col(c)[id] = {...(col(c)[id] || {}), ...d}; save(); },
    async del(c, id){ delete col(c)[id]; save(); },
    async reserver(id, ancien, d){ st = ls.get(K, st); const x = col('livraisons')[id]; if(!x || (x.rappels || 0) !== ancien) throw new Error('déjà fait'); Object.assign(x, d); save(); },

function client(){ S.role = 'client'; ls.set('role', {r:'client'});
  const id = ls.get('cmd', null), c = id && S.livraisons.find(x => x.id === id);
  if(c && (!['livree','annulee'].includes(c.statut) || Date.now() - (c.livreeLe || c.annuleeLe || 0) < 36e5

// recherche de lieu (OpenStreetMap / Nominatim, limitée au Bénin)
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
// lieux connus de l'entreprise : chaque mot tapé doit se retrouver dans le nom
function lieuxConnus(q){ const mots = norm(q).split(' ').filter(Boolean);
  return S.lieux.filter(x => { const n = norm(x.nom); return mots.every(m => n.includes(m)); })
    .sort((a,b) => (b.n || 1) - (a.n || 1)).slice(0, 6).map(x => ({lat:x.lat, lng:x.lng, nom:x.nom, detail:'Lieu connu', adresse:x.nom + ', ' + (x.zone || ''), connu:1})); }
const BENIN = '&bbox=0.77,6.2,3.85,12.42';
async function photon(q, sig){ const r = await fetch('https://photon.komoot.io/api/?limit=8&lang=fr&lat=6.40&lon=2.40' + BENIN + '&q=' + encodeURIComponent(q), {signal:sig});
  return (await r.json()).features.filter(f => (f.properties.countrycode || '').toUpperCase() === 'BJ').map(f => { const p = f.properties;
    const det = [p.street, p.district || p.locality, p.city || p.county].filter((x, i, a) => x && x !== p.name && a.indexOf(x) === i);
    return {lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0], nom:p.name || p.street || p.city, detail:det.join(', '), adresse:[p.name, ...det, p.state].filter(Boolean).join(', ')}; }); }
async function nominatim(q, sig){ const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=bj&accept-language=fr&limit=8&q=' + encodeURIComponent(q), {signal:sig});
  return (await r.json()).map(x => { const p = x.display_name.split(', '); return {lat:+x.lat, lng:+x.lon, nom:p[0], detail:p.slice(1, 4).join(', '), adresse:x.display_name}; }); }
// --- recherche Google (Places API New) ---
let GG = null;
function chargerGoogle(){ if(GG) return GG; if(!CONFIG.googleCle) return GG = Promise.resolve(null);
  return GG = new Promise(res => { window.__gmOk = () => res(window.google); const s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(CONFIG.googleCle) + '&libraries=places&language=fr&region=BJ&loading=async&callback=__gmOk';
    s.async = true; s.onerror = () => res(null); document.head.appendChild(s); setTimeout(() => res(null), 12000); }); }
async function rechercheGoogle(q, jeton){ const g = await chargerGoogle(); const P = g && g.maps.places;
  if(!P || !P.AutocompleteSuggestion) throw new Error('google');
  const {suggestions} = await P.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:q, includedRegionCodes:['bj'], language:'fr', region:'bj',
    locationBias:{center:{lat:6.40, lng:2.40}, radius:50000}, sessionToken:jeton});
  return suggestions.filter(s => s.placePrediction).map(s => { const p = s.placePrediction;
    return {nom:(p.mainText && p.mainText.text) || p.text.text, detail:(p.secondaryText && p.secondaryText.text) || '', adresse:p.text.text, gp:p}; }); }
function chercher(inp, box, choisir){ let tq = null, ctrl = null, trouves = [], jeton = null, n = 0;
  const nouveauJeton = async () => { const g = await chargerGoogle(); jeton = g && g.maps.places && g.maps.places.AutocompleteSessionToken ? new g.maps.places.AutocompleteSessionToken() : null; };
  const afficher = (liste, encours, google) => { trouves = liste;
    box.innerHTML = liste.map((x, i) => `<button type="button" data-i="${i}" class="${x.connu ? 'connu' : ''}"><b>${esc(x.nom)}</b><small>${esc(x.detail)}</small></button>`).join('')
      + (encours ? '<p class="note">Recherche…</p>' : liste.length ? (google ? '<p class="note gg">Résultats fournis par Google</p>' : '')
        : '<p class="note">Aucun lieu trouvé. Essayez un autre nom, ou touchez la carte pour placer le point.</p>'); };
  inp.onfocus = () => { if(CONFIG.googleCle && !jeton) nouveauJeton(); };
  inp.oninput = () => { clearTimeout(tq); const q = inp.value.trim(), moi = ++n;
    if(q.length < 2){ box.innerHTML = ''; return; }
    const loc = lieuxConnus(q); afficher(loc, q.length >= 3); if(q.length < 3) return;
    tq = setTimeout(async () => { let res = [], google = false;
      if(CONFIG.googleCle){ try { if(!jeton) await nouveauJeton(); res = await rechercheGoogle(q, jeton); google = res.length > 0; } catch {} }
      if(!res.length){ ctrl && ctrl.abort(); ctrl = new AbortController();
        const rs = await Promise.allSettled([photon(q, ctrl.signal), nominatim(q, ctrl.signal)]);
        rs.forEach(r => r.status === 'fulfilled' && res.push(...r.value)); }
      if(moi !== n) return;   // une frappe plus récente a eu lieu
      const tout = [...loc], vus = tout.map(x => norm(x.nom));
      res.forEach(x => { const k = x.lat != null ? x.lat.toFixed(3) + x.lng.toFixed(3) : norm(x.adresse);
        if(x.nom && !vus.includes(k) && !vus.includes(norm(x.nom))){ vus.push(k); tout.push(x); } });
      afficher(tout.slice(0, 12), false, google); }, CONFIG.googleCle ? 300 : 500); };
  box.onclick = async ev => { const b = ev.target.closest('[data-i]'); if(!b) return; const x = trouves[+b.dataset.i];
    if(x.gp){ b.querySelector('small').textContent = 'Placement sur la carte…';
      try { const pl = x.gp.toPlace(); await pl.fetchFields({fields:['location']}); x.lat = pl.location.lat(); x.lng = pl.location.lng(); }
      catch { return toast('Impossible de placer ce lieu, touchez la carte'); }
      jeton = null; }   // la session Google se termine au choix d'un lieu
    inp.value = x.nom; box.innerHTML = '';
    choisir({lat:x.lat, lng:x.lng, nom:x.nom, court:x.detail ? x.nom + ', ' + x.detail.split(', ')[0] : x.nom, adresse:x.adresse}); }; }
// mémorise un lieu (repère + position) pour les prochaines recherches
async function memoriser(nom, pos, zone){ nom = String(nom || '').trim(); if(!nom || !pos || pos.lat == null) return;
  const ex = S.lieux.find(x => norm(x.nom) === norm(nom));
  if(ex) await DB.set('lieux', ex.id, {n:(ex.n || 1) + 1, t:Date.now()});
  else await DB.add('lieux', {nom, lat:pos.lat, lng:pos.lng, zone:zone || '', n:1, t:Date.now(), auto:true}); }
// choisit la zone dont le nom apparaît dans l'adresse trouvée
const sansAccent = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function zoneAuto(sel, adresse){ const a = sansAccent(adresse);
  const z = S.p.zones.find(z => a.includes(sansAccent(z.n))) || S.p.zones.find(z => sansAccent(z.n).split(/[\s-]+/).some(w => w.length > 4 && a.includes(w)));
  if(z) sel.value = z.n; }

function solde(id){ const liv = S.livraisons.filter(c => c.livreurId === id && c.statut === 'livree');
  const enc = sum(liv, c => c.encaisse), part = sum(liv, commission), vers = sum(S.versements.filter(v => v.livreurId === id), v => v.montant);
  return {liv, enc, part, vers, reste: enc - part - vers}; }

          ${(() => { const mo = moyenne(l.id); return mo ? `<p>Ma note : <span class="etoiles">${etoiles(mo.m)}</span> ${mo.m.toFixed(1)} / 5 (${mo.n} avis)</p>` : ''; })()}<h3>Ma caisse (depuis le début)</h3><div class="kpis"><div class="kpi"><small>Encaissé</small><b>${F(s.enc)}</b></div>

          <div class="kpi"><small>Déjà versé</small><b>${F(s.vers)}</b></div><div class="kpi fort"><small>Reste à verser</small><b>${F(s.reste)}</b></div></div>

      const ord = {ouverte:0, encours:1, resolue:2}, pl = S.plaintes.slice().sort((a,b) => ord[a.statut] - ord[b.statut] || b.creeLe - a.creeLe);
      const carteP = x => `<div class="card plainte"><div class="row sb"><b>${esc(x.motif)}</b><span class="code">${esc(x.code)} · ${D(x.creeLe)} ${H(x.creeLe)}</span></div>
        <p>De : <b>${esc(x.nom || '')}</b> (${x.qui === 'dest' ? 'destinataire' : 'client'}) · livreur : ${esc(x.livreurNom || '—')}</p><p>${esc(x.texte)}</p>
        <div class="row">${contact(x.tel)}</div>
        <label class="form">Statut<select data-c="plStatut" data-id="${x.id}">${[['ouverte','Reçue'],['encours','En traitement'],['resolue','Résolue']].map(([v,t]) => `<option value="${v}" ${v === x.statut ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <label class="form">Réponse au client<textarea id="rep-${x.id}" rows="2">${esc(x.reponse || '')}</textarea></label>
        <button class="btn s jaune" data-a="plRep" data-id="${x.id}">Enregistrer la réponse</button></div>`;
      const ouv = pl.filter(x => x.statut !== 'resolue'), res = pl.filter(x => x.statut === 'resolue');
      const notes = S.livreurs.map(l => ({l, mo:moyenne(l.id)})).filter(x => x.mo).sort((a,b) => b.mo.m - a.mo.m);
      const coms = S.livraisons.flatMap(c => [['client', c.avisClient, c], ['destinataire', c.avisDest, c]]).filter(([, a]) => a && a.txt).sort((a,b) => b[1].t - a[1].t).slice(0, 15);
      const al = S.alertes.slice().sort((a,b) => b.t - a.t).slice(0, 20);
      $('#lst').innerHTML = `${al.length ? `<h3>🕵️ Alertes de contournement</h3>${al.map(x => `<div class="card plainte"><b>${esc(x.livreurNom)}</b> est resté plus de 5 min chez <b>${esc(x.clientNom)}</b> sans course <span class="note">· ${D(x.t)} ${H(x.t)}</span><div class="row">${contact(x.clientTel)}</div></div>`).join('')}` : ''}
        <h3>Réclamations à traiter</h3>${ouv.map(carteP).join('') || '<p class="note">Aucune.</p>'}
        ${res.length ? `<details><summary>${res.length} réclamation(s) résolue(s)</summary>${res.map(carteP).join('')}</details>` : ''}
        <h3>Notes des livreurs</h3>${notes.length ? `<table><tr><th>Livreur</th><th>Note</th><th class="n">Avis</th></tr>${notes.map(x => `<tr><td>${esc(x.l.nom)}</td><td><span class="etoiles">${etoiles(x.mo.m)}</span> ${x.mo.m.toFixed(1)}</td><td class="n">${x.mo.n}</td></tr>`).join('')}</table>` : '<p class="note">Pas encore d\'avis.</p>'}
        <h3>Derniers commentaires</h3>${coms.map(([qui, a, c]) => `<div class="card"><span class="etoiles">${etoiles(a.note)}</span> <span class="note">${qui} · ${esc(c.code)} · ${esc(c.livreurNom || '')}</span><p>${esc(a.txt)}</p></div>`).join('') || '<p class="note">Aucun.</p>'}`; }},
  cai: {h:'<div class="pad"><p class="note">Ce que chaque livreur doit remettre : encaissé − sa commission − versements déjà faits.</p><div id="lst"></div></div>',
    refresh(){ const vs = S.versements.slice().sort((a,b) => b.date - a.date).slice(0, 30);
      $('#lst').innerHTML = S.livreurs.map(l => { const s = solde(l.id);
        return `<div class="card"><div class="row sb"><b>${esc(l.nom)}</b><b class="gros">${F(s.reste)}</b></div>
          <p class="note">Encaissé ${F(s.enc)}${s.part ? ' · commission ' + F(s.part) : ''} · versé ${F(s.vers)}</p>
          <button class="btn s jaune" data-a="versement" data-id="${l.id}">Enregistrer un versement</button></div>`; }).join('') || '<p class="vide">Aucun livreur.</p>';
      $('#lst').innerHTML += `<h3>Derniers versements</h3>${vs.length ? `<table><tr><th>Date</th><th>Livreur</th><th class="n">Montant</th></tr>${vs.map(v => `<tr><td>${D(v.date)}</td><td>${esc(v.livreurNom)}${v.note ? '<br><span class="note">' + esc(v.note) + '</span>' : ''}</td><td class="n">${F(v.montant)}</td></tr>`).join('')}</table>` : '<p class="note">Aucun.</p>'}`; }},
  rap: {h:`<div class="pad"><div class="row"><button class="btn s" data-a="preset" data-id="j">Aujourd'hui</button><button class="btn s" data-a="preset" data-id="m">Ce mois</button><button class="btn s" data-a="preset" data-id="p">Mois dernier</button></div>
      <div class="row"><label style="flex:1">Du<input id="rDu" type="date" value="${S.rDu || iso(Date.now())}"></label><label style="flex:1">Au<input id="rAu" type="date" value="${S.rAu || iso(Date.now())}"></label></div><div id="lst"></div></div>`,
    init(){ $('#rDu').onchange = $('#rAu').onchange = () => { S.rDu = $('#rDu').value; S.rAu = $('#rAu').value; VUE.refresh(); }; },
    refresh(){ const a = +new Date($('#rDu').value + 'T00:00'), b = +new Date($('#rAu').value + 'T00:00') + 864e5;
      const liv = S.livraisons.filter(c => c.statut === 'livree' && c.livreeLe >= a && c.livreeLe < b);
      const ann = S.livraisons.filter(c => c.statut === 'annulee' && c.creeLe >= a && c.creeLe < b).length;
      const grp = k => { const g = {}; liv.forEach(c => { const x = g[c[k] || '—'] ||= {n:0, f:0, e:0, c:0}; x.n++; x.f += +c.frais || 0; x.e += +c.encaisse || 0; x.c += commission(c); }); return Object.entries(g).sort((x,y) => y[1].n - x[1].n); };
      const avecC = S.p.part || S.p.fixe, pl = grp('livreurNom'), pz = grp('zone'), tf = sum(liv, c => c.frais), te = sum(liv, c => c.encaisse);
      const tab = (t, rows, cm) => `<h3>${t}</h3><div class="scroll"><table><tr><th></th><th class="n">Courses</th><th class="n">Frais</th><th class="n">Encaissé</th>${cm ? '<th class="n">Commission</th>' : ''}</tr>${rows.map(([k,x]) => `<tr><td>${esc(k)}</td><td class="n">${x.n}</td><td class="n">${F(x.f)}</td><td class="n">${F(x.e)}</td>${cm ? `<td class="n">${F(x.c)}</td>` : ''}</tr>`).join('')}</table></div>`;
      S.rapTxt = `Rapport ${S.p.entreprise} du ${D(a)} au ${D(b - 1)}\nLivraisons : ${liv.length} (annulées : ${ann})\nFrais : ${F(tf)}\nEncaissé : ${F(te)}\n\nPar livreur :\n` + pl.map(([k,x]) => `- ${k} : ${x.n} courses, ${F(x.f)} de frais, ${F(x.e)} encaissés${avecC ? ', commission ' + F(x.c) : ''}`).join('\n') + '\n\nPar zone :\n' + pz.map(([k,x]) => `- ${k} : ${x.n} courses, ${F(x.f)}`).join('\n');
      $('#lst').innerHTML = `<div class="kpis"><div class="kpi fort"><small>Livraisons</small><b>${liv.length}</b></div><div class="kpi"><small>Frais</small><b>${F(tf)}</b></div>
        <div class="kpi"><small>Encaissé</small><b>${F(te)}</b></div><div class="kpi"><small>Annulées</small><b>${ann}</b></div></div>
        ${liv.length ? tab('Par livreur', pl, avecC) + tab('Par zone', pz) : '<p class="vide">Aucune livraison sur cette période.</p>'}
        ${(() => { const lim = Date.now() - (+S.p.relanceJours || 14) * 864e5, cl = clientsReguliers();
          const rel = cl.filter(x => x.n >= 3 && x.der < lim).sort((a,b) => b.n - a.n);
          const risq = cl.filter(x => x.n >= 3).map(x => { const [nom, n] = Object.entries(x.lv).sort((a,b) => b[1] - a[1])[0] || ['', 0]; return {...x, lvNom:nom, part:n / x.n}; }).filter(x => x.part >= .7);
          return `<h3>📞 Clients réguliers à relancer</h3><p class="note">Au moins 3 livraisons, mais plus aucune commande depuis ${+S.p.relanceJours || 14} jours : ils passent peut-être par un livreur en direct.</p>
            ${rel.map(x => `<div class="card"><b>${esc(x.nom)}</b> · ${x.n} livraisons · dernière le ${D(x.der)}<div class="row">${contact(x.tel)}</div></div>`).join('') || '<p class="note">Aucun pour l\'instant.</p>'}
            <h3>⚠️ Clients toujours servis par le même livreur</h3><p class="note">Risque de contact direct : pensez à varier les livreurs pour ces clients.</p>
            ${risq.map(x => `<p>• <b>${esc(x.nom)}</b> : ${Math.round(x.part * 100)} % de ses livraisons par <b>${esc(x.lvNom)}</b></p>`).join('') || '<p class="note">Aucun.</p>'}`; })()}
        <div class="row" style="margin-top:14px"><a class="btn jaune" href="${wa('', S.rapTxt)}">Partager sur WhatsApp</a><button class="btn" data-a="copier">Copier le texte</button></div>`; }},
  reg: {h:`<div class="pad"><form id="f" class="form">
      <label>Nom de l'entreprise<input name="entreprise" required value="${esc(S.p.entreprise)}"></label>
      <label>Téléphone de l'entreprise (affiché aux clients)<input name="tel" type="tel" value="${esc(S.p.tel)}"></label>
      <label>Code PIN patron<input name="pinPatron" inputmode="numeric" required value="${esc(S.p.pinPatron)}"></label>
      <fieldset class="sec s-pay"><legend>💰 Commission du livreur</legend>
      <label>Pourcentage des frais de livraison (%)<input name="part" type="number" min="0" max="100" value="${+S.p.part || 0}"></label>
      <label>Et/ou montant fixe par course livrée (F CFA)<input name="fixe" type="number" min="0" value="${+S.p.fixe || 0}"></label>
      <p class="note">Mettez 0 et 0 si vos livreurs sont salariés.</p></fieldset>
      <label>Types de colis proposés aux clients (un par ligne)<textarea name="typesColis" rows="7">${esc(S.p.typesColis.join('\n'))}</textarea></label>
      <fieldset class="sec s-colis"><legend>📏 Calcul du prix de livraison</legend>
      <label>Mode de calcul<select name="tarifMode"><option value="zone" ${!modeKm() ? 'selected' : ''}>Par zone (tarifs ci-dessous)</option><option value="km" ${modeKm() ? 'selected' : ''}>Selon la distance réelle récupération → livraison</option></select></label>
      <label>Prix de départ (F)<input name="base" type="number" min="0" value="${+S.p.base || 0}"></label>
      <label>Prix par kilomètre (F)<input name="parKm" type="number" min="0" value="${+S.p.parKm || 0}"></label>
      <label>Prix minimum (F)<input name="minimum" type="number" min="0" value="${+S.p.minimum || 0}"></label>
      <p class="note">Exemple : départ ${F(S.p.base)} + ${F(S.p.parKm)}/km → 5 km = ${F(prixKm(5))}. Le prix ne dépend plus de la position du siège ni du livreur.</p></fieldset>
      <fieldset class="sec s-reco"><legend>🎁 Fidélité et anti-contournement</legend>
      <label>Livraison offerte toutes les N livraisons (0 = non)<input name="fidelite" type="number" min="0" value="${+S.p.fidelite || 0}"></label>
      <div class="choix"><label><input type="checkbox" name="masquer" ${S.p.masquer ? 'checked' : ''}>Cacher les numéros livreur ↔ client en dehors des courses</label></div>
      <label>Numéro Mobile Money de l'entreprise (le client paie l'entreprise, pas le livreur)<input name="momo" type="tel" value="${esc(S.p.momo)}"></label>
      <label>Rappeler le livreur (et prévenir le patron) toutes les<select name="rappelMin">${[5,10,15,20].map(n => `<option value="${n}" ${(+S.p.rappelMin || 10) === n ? 'selected' : ''}>${n} minutes</option>`).join('')}</select></label>
      <p class="note">Tant que le colis n'est pas récupéré, le livreur est rappelé (sonnerie + ntfy). Dès le 2ᵉ rappel, le patron est prévenu. Les demandes que personne n'accepte sont aussi rappelées à tous.</p>
      <label>Relancer un client régulier après combien de jours sans commande<input name="relanceJours" type="number" min="1" value="${+S.p.relanceJours || 14}"></label>
      <p class="note">Les livreurs en service sont surveillés : s'ils restent plus de 5 min chez un client régulier sans course, vous recevez une alerte. Prévenez-les : cela suffit souvent à décourager les arrangements.</p></fieldset>
      <fieldset class="sec s-delai"><legend>🔔 Alertes téléphone verrouillé (ntfy)</legend>
      <div class="choix"><label><input type="checkbox" name="ntfyActif" ${S.p.ntfyActif ? 'checked' : ''}>Envoyer les alertes vers l'application ntfy</label></div>
      <div class="choix"><label><input type="checkbox" name="ecranAllume" ${S.p.ecranAllume ? 'checked' : ''}>Garder aussi l'écran allumé pendant le service (inutile avec ntfy, consomme la batterie)</label></div>
      <p class="note">🔋 Pour que ntfy sonne écran éteint : Paramètres du téléphone → Applications → ntfy → Batterie → « Non restreinte ». ntfy consomme très peu.</p>
      <p class="note">1) Installez <b>ntfy</b> (Play Store / App Store) sur le téléphone du patron et de chaque livreur. 2) Dans ntfy, touchez <b>+</b>, écrivez le nom du canal, cochez « livraison instantanée », puis <b>S'abonner</b>. 3) Dans les réglages de ntfy, activez la sonnerie <b>insistante</b> pour la priorité maximale : le téléphone sonnera en boucle comme un appel.</p>
      <p><b>Canal patron + livreurs</b> (nouvelles demandes) :</p><p class="lienTxt">${esc(S.p.ntfyCanal || '…')}</p>
      <p><b>Canal du patron seul</b> (réclamations, alertes) :</p><p class="lienTxt">${esc(canalPatron())}</p>
      <p class="note">Chaque livreur a aussi son canal personnel : il le trouve dans « Mon bilan », et vous dans l'onglet Livreurs.</p>
      <p class="soustitre">Alertes ntfy par livreur (cochez pour activer) :</p>
      ${S.livreurs.filter(l => l.actif !== false).map(l => `<div class="row sb lvNtfy"><label class="row" style="margin:0;font-weight:600"><input type="checkbox" data-c="ntfyLv" data-id="${l.id}" ${l.ntfyOn !== false ? 'checked' : ''} style="width:22px;min-height:22px;margin:0">${avatar(l.id, 'mini')}${esc(l.nom)}</label>
        <span class="badge ${l.ntfyOk ? 'vert' : ''}" style="${l.ntfyOk ? '' : 'background:var(--r)'}">${l.ntfyOk ? '✓ vérifié' : 'non vérifié'}</span><button type="button" class="btn s" data-a="testLv" data-id="${l.id}">🔔 Tester</button></div>`).join('') || '<p class="note">Aucun livreur.</p>'}
      <p class="note">Décoché : ce livreur ne reçoit plus ses alertes personnelles (courses attribuées, rappels, messages). Pour les nouvelles demandes, il se désabonne lui-même du canal général dans ntfy.</p>
      <button type="button" class="btn s" data-a="testNtfy">🔔 Envoyer une alerte de test</button></fieldset>
      <label>Zones et tarifs (une par ligne : Nom = prix)<textarea name="zones" rows="9">${esc(S.p.zones.map(z => z.n + ' = ' + z.p).join('\n'))}</textarea></label>
      <p class="note">Les tarifs proposés au départ sont des exemples à adapter.</p>
      <button type="button" class="btn plein" data-a="lieux">📍 Lieux connus (${S.lieux.length})</button>
      <button type="button" class="btn plein" data-a="liens">🔗 Liens à partager et QR code</button>
      <button class="btn jaune plein">Enregistrer</button></form>
      <p class="note">LIVRAISONS version ${VERSION} · ${DB.local ? 'Mode essai : les données restent sur ce téléphone.' : 'Base en ligne connectée.'}${CONFIG.licenceCle ? ' Licence : ' + esc(CONFIG.licenceCle) : ''}</p>
      <button class="btn plein" data-a="sortie">Fermer l'espace patron</button></div>`,
    init(){ const f = $('#f'); f.onsubmit = async ev => { ev.preventDefault(); const d = Object.fromEntries(new FormData(f));
      const zones = d.zones.split('\n').map(x => x.split('=')).filter(x => x.length === 2 && x[0].trim()).map(([n,p]) => ({n:n.trim(), p:+num(p) || 0}));
      if(!zones.length) return toast('Ajoutez au moins une zone');
      await DB.set('params', 'general', {entreprise:d.entreprise.trim(), tel:d.tel.trim(), pinPatron:d.pinPatron.trim(), part:+d.part || 0, fixe:+d.fixe || 0, tarifMode:d.tarifMode, base:+d.base || 0, parKm:+d.parKm || 0, minimum:+d.minimum || 0, fidelite:+d.fidelite || 0, masquer:!!d.masquer, momo:(d.momo || '').trim(), relanceJours:+d.relanceJours || 14, rappelMin:+d.rappelMin || 10, ntfyActif:!!d.ntfyActif, ecranAllume:!!d.ecranAllume, zones, typesColis:d.typesColis.split('\n').map(x => x.trim()).filter(Boolean)}); toast('Réglages enregistrés'); }; }}
  }[tab];
  show(T + `<div class="vue t-${tab}">` + V.h + '</div>', V); }

// ---------- actions ----------
const ACT = {
  testLv(id){ const l = S.livreurs.find(x => x.id === id); ntfy(canalLv(id), '🔔 Test E-Courses', `Bonjour ${l ? l.nom : ''}, vos alertes fonctionnent. Touchez cette notification pour arrêter la sonnerie.`, 5, '#livreur'); toast('Une alerte de test envoyée : le téléphone doit sonner'); },
  async ntfyOk(id){ const l = S.livreurs.find(x => x.id === id); await DB.set('livreurs', id, {ntfyOk: !l.ntfyOk}); },
  testNtfy(){ ntfy(canalPatron(), '🔔 Test E-Courses', 'Les alertes fonctionnent. Touchez cette notification pour arrêter la sonnerie.', 5, '#patron'); toast('Une alerte de test envoyée : touchez la notification pour arrêter la sonnerie'); },
  voirPhoto(id){ const l = S.livreurs.find(x => x.id === id); if(!l || !l.photo) return; modal(`<h2>${esc(l.nom)}</h2><img src="${l.photo}" alt="" style="width:100%;border-radius:14px"><button class="btn plein" data-a="fermer">Fermer</button>`); },
  ferAl(k){ sansAlerte(k); },
  alarmeOk(){ fermer(); setTimeout(surveiller, 400); },   // affiche l'alarme suivante s'il y en a
  async envMsg(id, el){ const de = el.dataset.de, inp = $('#mTxt-' + de), txt = (el.dataset.t || (inp && inp.value) || '').trim(); if(!txt) return toast('Écrivez un message');
    const a = el.dataset.to || (document.querySelector('[name=dst]:checked') || {}).value || 'client', c = S.livraisons.find(x => x.id === id);
    await DB.add('messages', {livraisonId:id, de, a, txt, nom: de === 'livreur' && S.lv ? S.lv.nom : '', t:Date.now()});
    if(de !== 'livreur' && c && c.livreurId) ntfy(canalLv(c.livreurId), de === 'dest' ? '💬 Message du receveur' : "💬 Message de l'expéditeur", c.code + ' : ' + txt, 4, '#livreur');
    if(inp && !el.dataset.t) inp.value = ''; toast('Message envoyé ✓');
    if(de === 'livreur'){ fermer();
      if(a === 'dest' && c && c.destTel) modal(`<h2>Message envoyé ✓</h2><p>Le receveur n'a peut-être pas ouvert la page de suivi. Envoyez-lui aussi ce message par WhatsApp :</p>
        <a class="btn vert plein" href="${wa(c.destTel, txt + ' — ' + S.p.entreprise + ', colis ' + c.code + '. Suivi : ' + lienColis(id))}">Envoyer par WhatsApp</a><button class="btn plein" data-a="fermer">Fermer</button>`); } },
  msgLv(id){ const c = S.livraisons.find(x => x.id === id); if(!c) return; const versDest = c.statut === 'recuperee';
    modal(`<h2>💬 Message</h2><div class="choix"><label><input type="radio" name="dst" value="client" ${versDest ? '' : 'checked'}>À l'expéditeur (${esc(c.clientNom)})</label>
      <label><input type="radio" name="dst" value="dest" ${versDest ? 'checked' : ''}>Au receveur${c.destNom ? ' (' + esc(c.destNom) + ')' : ''}</label></div>
      <p class="note">Touchez un message pour l'envoyer tout de suite :</p>
      <div class="choix">${MSG_LV.map(t => `<button type="button" class="btn s" data-a="envMsg" data-id="${id}" data-de="livreur" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <p class="note">Patientez, je serai là dans… :</p><div class="choix">${[5,10,15,20,30,45].map(n => `<button type="button" class="btn s jaune" data-a="envMsg" data-id="${id}" data-de="livreur" data-t="⏱️ Patientez, je serai là dans ${n} min environ">${n} min</button>`).join('')}</div>
      <label class="form">Ou écrivez votre message<textarea id="mTxt-livreur" rows="2"></textarea></label>
      <button class="btn jaune plein" data-a="envMsg" data-id="${id}" data-de="livreur">Envoyer</button><button class="btn plein" data-a="fermer">Fermer</button>`); },
  async payeur(v){ const [id, qui] = v.split('|'), c = S.livraisons.find(x => x.id === id); if(!c) return;
    if(qui === 'dest' && !c.destTel) return modal(`<h2>Téléphone du receveur</h2><p>Pour que le receveur paie, il faut son numéro pour le prévenir.</p><form id="fm" class="form">
      <label>Téléphone du receveur<input name="t" type="tel" required></label><button class="btn jaune plein">Continuer</button><button type="button" class="btn plein" data-a="fermer">Retour</button></form>`,
      () => { $('#fm').onsubmit = async ev => { ev.preventDefault(); await DB.set('livraisons', id, {destTel:$('#fm').t.value.trim()}); fermer(); setTimeout(() => ACT.payeur(v), 300); }; });
    await DB.set('livraisons', id, {payeur:qui, payeurLe:Date.now(), payeurPar:'client'});
    { const t = `${c.code} : c'est ${qui === 'dest' ? 'le RECEVEUR' : "l'EXPÉDITEUR"} qui paie la livraison.`; ntfy(canalPatron(), '💰 Paiement choisi par le client', t, 4, '#patron'); if(c.livreurId) ntfy(canalLv(c.livreurId), '💰 Paiement choisi par le client', t, 4, '#livreur'); }
    if(qui === 'dest') ACT.prevenirDest(id);

// ---------- démarrage ----------
const T0 = Date.now();
function finSplash(){ setTimeout(() => { const s = $('#splash'); s.classList.add('fin'); setTimeout(() => s.remove(), 600); }, Math.max(0, 1800 - (Date.now() - T0))); }
const avecDelai = (pr, ms) => Promise.race([Promise.resolve(pr).catch(() => {}), new Promise(r => setTimeout(r, ms))]);
async function demarrer(){
  $('#ver').textContent = 'v' + VERSION;
  $('#nomEnt').textContent = CONFIG.entreprise;
  const enLigne = CONFIG.firebase.apiKey && typeof firebase !== 'undefined';
  majNet();
  if(!enLigne){ DB = localDB(); DB.local = true; $('#mode').textContent = 'Mode essai'; suivreDB(); }
  else {
    if(!await verifierLicence()){ finSplash(); $('#app').innerHTML = `<div class="pad"><h2>Licence inactive</h2><p>Cette application n'est pas activée ou sa licence a expiré.</p><p>Contactez votre fournisseur : <b>${esc(CONFIG.fournisseur)}</b></p></div>`; return; }
    firebase.initializeApp(CONFIG.firebase);
    await avecDelai(firebase.firestore().enablePersistence({synchronizeTabs:true}), 3000);   // mode hors connexion (si le navigateur le permet)
    try { const r = await Promise.race([firebase.auth().signInAnonymously(), new Promise((_, ko) => setTimeout(() => ko(new Error('délai dépassé')), 8000))]); } catch(er){ alerte('net', "📶 Connexion au serveur impossible : vérifiez Internet puis rechargez la page. (" + er.message + ')', 'net', true); }
    DB = fireDB(); suivreDB();
  }
  const cols = ['livraisons','livreurs','positions','versements','params','plaintes','lieux','messages','alertes'];
  await Promise.race([Promise.all(cols.map(c => new Promise(res => DB.watch(c, a => { S[c] = a; S.ok[c] = 1;
    if(c === 'params'){ S.p = {...DEF, ...(a.find(x => x.id === 'general') || {})}; $('#nomEnt').textContent = S.p.entreprise; }
    res(); VUE.refresh && VUE.refresh(); surveiller(); })))), new Promise(r => setTimeout(r, 6000))]);
  const sv = ls.get('role', null) || {};
  const lienDirect = () => { const x = location.hash;
    if(x.startsWith('#avis-') || x.startsWith('#colis-')){ avisDest(x.slice(x.indexOf('-') + 1)); return true; }
    if(x === '#client'){ ls.set('viaLien', 1); client(); return true; }
    if(x === '#livreur'){ livreurLogin(); return true; }
    if(x === '#patron'){ patronLogin(); return true; }
    return false; };
  addEventListener('hashchange', lienDirect);
  finSplash();
  if(/Android/i.test(navigator.userAgent) && horsChrome() && location.protocol !== 'file:') alerte('info', "ℹ️ Vous êtes dans WhatsApp. Pour le GPS et les alarmes, touchez ⋮ en haut à droite puis « Ouvrir dans Chrome ».", 'gps', true);
  if(lienDirect()) {} else if(sv.r === 'client') client(); else if(sv.r === 'livreur') livreurLogin(); else if(sv.r === 'patron') patronLogin(); else accueil();
}
demarrer().catch(er => { finSplash(); $('#app').innerHTML = `<div class="pad"><h2>Erreur au démarrage</h2><p>${esc(er.message)}</p></div>`; });
